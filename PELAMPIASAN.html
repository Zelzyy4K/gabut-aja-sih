<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Anti-Stress WebDev 🚀</title>
    <style>
        /* --- CSS STYLES --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Interactive Canvas Background */
        #bgCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Glassmorphism Card Container */
        .card {
            position: relative;
            z-index: 2;
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            text-align: center;
            max-width: 450px;
            width: 90%;
            transition: transform 0.1s ease;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 1rem;
            background: linear-gradient(45deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .quote-box {
            background: rgba(15, 23, 42, 0.6);
            padding: 1rem;
            border-radius: 10px;
            border-left: 4px solid #38bdf8;
            margin-bottom: 1.5rem;
            min-height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-style: italic;
            color: #cbd5e1;
        }

        .counter-label {
            font-size: 0.9rem;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .counter-val {
            font-size: 3rem;
            font-weight: bold;
            color: #f43f5e;
            margin-bottom: 1.5rem;
        }

        /* Rage Button */
        .btn-rage {
            background: linear-gradient(135deg, #e11d48, #9333ea);
            color: white;
            border: none;
            padding: 1rem 2rem;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(225, 29, 72, 0.4);
            transition: all 0.2s ease;
            outline: none;
            user-select: none;
        }

        .btn-rage:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 25px rgba(225, 29, 72, 0.6);
        }

        .btn-rage:active {
            transform: translateY(2px) scale(0.95);
        }

        /* Screen Shake Animation */
        .shake {
            animation: shake 0.2s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(4px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
            40%, 60% { transform: translate3d(6px, 0, 0); }
        }
    </style>
</head>
<body>

    <!-- Background Particle Canvas -->
    <canvas id="bgCanvas"></canvas>

    <!-- Main Card -->
    <div class="card" id="mainCard">
        <h1>Pelampiasan WebDev 🔥</h1>
        
        <div class="quote-box" id="quoteDisplay">
            "Klik tombol di bawah pas kodingan lo error!"
        </div>

        <div class="counter-label">Level Emosi Terkumpul</div>
        <div class="counter-val" id="counter">0</div>

        <button class="btn-rage" id="rageBtn">TEKAN PAS EMOSI! 💥</button>
    </div>

    <!-- --- JAVASCRIPT --- -->
    <script>
        // --- 1. RAGE COUNTER & QUOTES LOGIC ---
        let count = 0;
        const btn = document.getElementById('rageBtn');
        const counterDisplay = document.getElementById('counter');
        const quoteDisplay = document.getElementById('quoteDisplay');
        const card = document.getElementById('mainCard');

        const devQuotes = [
            "Gara-gara lupa titik koma (;), sejam melayang!",
            "DIV ke tengah susahnya melebihi naklukin calon mertua.",
            "Works on my machine, di server malah rontok!",
            "Uncaught TypeError: Cannot read properties of undefined. MAMPUS!",
            "Tadi bisa, sekarang error. Padahal kagak ada yang diubah!",
            "CSS Flexbox vs Grid: Pertarungan tanpa akhir.",
            "Coba restart VS Code dulu, siapa tahu mukjizat.",
            "npm install = download seisi bumi ke folder node_modules.",
            "Git push --force... Bismillah pasrah!",
            "Desain dari UI/UX ramah, kodingannya bikin emosi!"
        ];

        btn.addEventListener('click', () => {
            // Increment Count
            count++;
            counterDisplay.innerText = count;

            // Random Quote Change
            const randomIndex = Math.floor(Math.random() * devQuotes.length);
            quoteDisplay.innerText = `"${devQuotes[randomIndex]}"`;

            // Screen Shake Effect
            card.classList.remove('shake');
            void card.offsetWidth; // Trigger reflow
            card.classList.add('shake');

            // Add Temporary Burst Particles
            createBurst(window.innerWidth / 2, window.innerHeight / 2);
        });

        // --- 2. CANVAS PARTICLE SYSTEM ---
        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let particlesArray = [];

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        class Particle {
            constructor(x, y, speedX, speedY) {
                this.x = x || Math.random() * canvas.width;
                this.y = y || Math.random() * canvas.height;
                this.size = Math.random() * 3 + 1;
                this.speedX = speedX || (Math.random() * 1.5 - 0.75);
                this.speedY = speedY || (Math.random() * 1.5 - 0.75);
                this.color = '#38bdf8';
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;

                if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
                if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;
            }

            draw() {
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function initParticles() {
            particlesArray = [];
            for (let i = 0; i < 70; i++) {
                particlesArray.push(new Particle());
            }
        }

        function createBurst(x, y) {
            for (let i = 0; i < 15; i++) {
                const speedX = (Math.random() - 0.5) * 8;
                const speedY = (Math.random() - 0.5) * 8;
                const p = new Particle(x, y, speedX, speedY);
                p.color = '#f43f5e'; // Red particle on click
                particlesArray.push(p);
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw & connect particles
            for (let i = 0; i < particlesArray.length; i++) {
                particlesArray[i].update();
                particlesArray[i].draw();

                for (let j = i; j < particlesArray.length; j++) {
                    const dx = particlesArray[i].x - particlesArray[j].x;
                    const dy = particlesArray[i].y - particlesArray[j].y;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < 100) {
                        ctx.beginPath();
                        ctx.strokeStyle = `rgba(56, 189, 248, ${1 - distance / 100})`;
                        ctx.lineWidth = 0.5;
                        ctx.moveTo(particlesArray[i].x, particlesArray[i].y);
                        ctx.lineTo(particlesArray[j].x, particlesArray[j].y);
                        ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(animate);
        }

        initParticles();
        animate();
    </script>
</body>
</html>
